name: Go live

# Deploys each changed app to a public Cloudflare URL (workers.dev, plus a
# custom domain when ROOT_DOMAIN is set).
#
# Repo secrets:
#   CLOUDFLARE_API_TOKEN     Account: Workers Scripts Edit, D1 Edit, Account Settings Read
#                            Zone (optional): DNS Edit, SSL Edit, Workers Routes Edit
#   CLOUDFLARE_ACCOUNT_ID
# Optional variables/secrets:
#   ROOT_DOMAIN              e.g. example.com → {subdomain}.example.com
#   CLOUDFLARE_ZONE_ID
#   CLOUDFLARE_WORKERS_DEV_SUBDOMAIN

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug to publish (empty = every app in apps.registry.json)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "apps.registry.json"
      - "scripts/go-live.mjs"
      - "scripts/detect-apps.mjs"
      - "scripts/lib/**"
      - "scripts/provision-cloudflare.sh"

concurrency:
  group: go-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      skip: ${{ steps.creds.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Set repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Account: Workers Scripts Edit, D1 Edit, Account Settings Read)."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set; skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish apps."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: detect
        if: steps.creds.outputs.skip != 'true'
        env:
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/detect-apps.mjs

  deploy:
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.detect.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Go live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN || secrets.ROOT_DOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: pnpm go-live ${{ matrix.slug }}
